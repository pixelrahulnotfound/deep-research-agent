[project]
name = "deep-researcher-agent"
version = "0.1.0"
description = "A multi-stage research workflow agent powered by Agno and Scrapegraph"
authors = [
    {name = "pixelrahulnotfound"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno",
    "openai",
    "scrapegraph-py",
    "python-dotenv",
    "mcp",
    "streamlit",
    "pydantic",
]

[project.urls]
Homepage = "https://github.com/pixelrahulnotfound/deep-research-agent"
Repository = "https://github.com/pixelrahulnotfound/deep-research-agent"
Issues = "https://github.com/pixelrahulnotfound/deep-research-agent/issues"
